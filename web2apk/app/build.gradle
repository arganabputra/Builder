plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xxsync.web'
    compileSdk 34

    defaultConfig {
        applicationId project.findProperty('appId') ?: 'com.xxsync.web'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
