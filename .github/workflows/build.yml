name: Xx.synC Build
run-name: Build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job ID
        required: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: job-${{ inputs.job }}
          path: job
          fetch-depth: 1

      - name: Baca config
        run: |
          touch build.log
          {
            echo "TYPE=$(jq -r .type job/config.json)"
            echo "MODE=$(jq -r '.mode // "release"' job/config.json)"
            echo "ABI=$(jq -r '.abi // "arm64"' job/config.json)"
            echo "FLUTTER_VERSION=$(jq -r '.flutterVersion // ""' job/config.json)"
            echo "APP_ID=$(jq -r '.appId // ""' job/config.json)"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.caching=true' 'org.gradle.parallel=true' 'org.gradle.daemon=false' 'org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC' 'android.useAndroidX=true' > ~/.gradle/gradle.properties

      # ---------------- FLUTTER ----------------
      - name: Siapkan project Flutter
        if: env.TYPE == 'flutter'
        run: |
          mkdir flutter-project
          unzip -q job/project.zip -d flutter-project
          chmod +x flutter-project/android/gradlew 2>/dev/null || true

      - name: Setup Flutter
        if: env.TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache dependency (Flutter)
        if: env.TYPE == 'flutter'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-flutter-${{ hashFiles('flutter-project/pubspec.yaml') }}
          restore-keys: |
            deps-flutter-

      - name: Build Flutter APK
        if: env.TYPE == 'flutter'
        working-directory: flutter-project
        run: |
          export CI=true
          FLAGS=""
          if [ "$ABI" = "arm64" ]; then FLAGS="--target-platform android-arm64"; fi
          flutter pub get 2>&1 | tee -a ../build.log
          flutter build apk --$MODE $FLAGS 2>&1 | tee -a ../build.log
          APK=$(find build/app/outputs -name '*.apk' | head -n1)
          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"

      # ---------------- WEB2APK ----------------
      - name: Cache Gradle (Web2APK)
        if: env.TYPE == 'web2apk'
        uses: actions/cache@v4
        with:
          path: |
            ~/gradle-8.9
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-web2apk-v1

      - name: Build Web2APK
        if: env.TYPE == 'web2apk'
        working-directory: web2apk
        run: |
          if [ ! -d ~/gradle-8.9 ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d ~
          fi
          mkdir -p app/src/main/res
          cp -r ../job/res/. app/src/main/res/
          ~/gradle-8.9/bin/gradle assembleRelease -PappId="$APP_ID" 2>&1 | tee -a ../build.log
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"

      # ---------------- SIGN + UPLOAD ----------------
      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir -p out
          keytool -genkeypair -keystore ks.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Xx.synC, O=Xx.synC, C=ID" >/dev/null 2>&1
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out out/app.apk "$APK"

      - name: Simpan log
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ inputs.job }}
          path: out
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
